[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rad-experiment-monitoring-cli"
version = "0.1.0"
description = "Terminal tool to monitor radiation experiments logs for SDCs"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-2.0-only"}
dependencies = [
    "markdown-it-py>=4.2.0",
    "mdurl>=0.1.2",
    "Pygments>=2.20.0",
    "rich>=15.0.0",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.0",
]

[project.scripts]
rad-monitor = "monitor:main"

[tool.setuptools]
packages = ["monitoring"]
py-modules = ["monitor"]
